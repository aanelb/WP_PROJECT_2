<!-- src/app/login/login.component.html -->
<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Korisničko ime</label>
      <input id="username" formControlName="username" type="text" placeholder="Unesite korisničko ime" />
    </div>
    
    <div class="form-group">
      <label for="password">Lozinka</label>
      <input id="password" formControlName="password" type="password" placeholder="Lozinka" />
    </div>
    
    <button type="submit" [disabled]="loginForm.invalid">Prijava</button>
  </form>

  <div class="error-box" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
</div>
